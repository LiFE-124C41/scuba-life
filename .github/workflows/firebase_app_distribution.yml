name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '対象プラットフォーム (android / ios)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      binary_type:
        description: 'バイナリ形式 (android: apk または aab / ios: ipa)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - ipa
      groups:
        description: '配布先テスターグループ (カンマ区切り, 例: internal-testers,testers)'
        required: false
        default: 'testers'
        type: string
      release_notes:
        description: 'リリースノート (省略時は最新コミットから自動生成)'
        required: false
        type: string

  # タグプッシュ時（v1.0.0 など）に自動配布したい場合はコメントアウトを解除
  # push:
  #   tags:
  #     - 'v*'

jobs:
  distribute-android:
    name: Distribute Android
    if: inputs.platform == 'android' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🟢 Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Configure Firebase Credentials & Configs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          # 1. サービスアカウント認証キーの設定
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_service_account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_service_account.json" >> $GITHUB_ENV
            echo "Service account credentials configured."
          fi

          # 2. google-services.json の復元（Secretが設定されている場合）
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Restored android/app/google-services.json from secret."
          fi

          # 3. firebase_options.dart の復元（Secretが設定されている場合）
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            mkdir -p lib
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
            echo "Restored lib/firebase_options.dart from secret."
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build Android Release Binary
        env:
          INPUT_BINARY_TYPE: ${{ inputs.binary_type }}
        run: |
          TARGET_TYPE="${INPUT_BINARY_TYPE:-apk}"
          if [ "$TARGET_TYPE" = "aab" ]; then
            flutter build appbundle --release --build-number="${{ github.run_number }}"
          else
            flutter build apk --release --build-number="${{ github.run_number }}"
          fi

      - name: 🚀 Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          INPUT_BINARY_TYPE: ${{ inputs.binary_type }}
          INPUT_GROUPS: ${{ inputs.groups }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          TARGET_TYPE="${INPUT_BINARY_TYPE:-apk}"
          if [ "$TARGET_TYPE" = "aab" ]; then
            BINARY_PATH="build/app/outputs/bundle/release/app-release.aab"
          else
            BINARY_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi

          # App ID の特定
          APP_ID="1:37794312799:android:c7583980414fa79d3c61ea"
          if [ -f "firebase.json" ]; then
            PARSED_ID=$(node -e "
              try {
                const j = JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));
                console.log(j.flutter?.platforms?.android?.default?.appId || j.flutter?.platforms?.dart?.['lib/firebase_options.dart']?.configurations?.android || '');
              } catch(e){}
            " 2>/dev/null || true)
            if [ -n "$PARSED_ID" ]; then
              APP_ID="$PARSED_ID"
            fi
          fi

          # リリースノートの準備
          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            NOTES="$INPUT_RELEASE_NOTES"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || true)
            HASH=$(git rev-parse --short HEAD 2>/dev/null || true)
            TIMESTAMP=$(date "+%Y-%m-%d %H:%M:%S")
            ACTOR_NAME="${GITHUB_ACTOR:-ci}"
            NOTES="Scuba Life (Android #$GITHUB_RUN_NUMBER)"$'\n'
            NOTES="${NOTES}Date: $TIMESTAMP"$'\n'
            NOTES="${NOTES}Branch: $GITHUB_REF_NAME ($HASH)"$'\n'
            NOTES="${NOTES}Triggered by: @$ACTOR_NAME"$'\n\n'
            NOTES="${NOTES}Commit:"$'\n'
            NOTES="${NOTES}$COMMIT_MSG"
          fi

          echo "Distributing $BINARY_PATH to App ID: $APP_ID..."

          DIST_ARGS=(
            "appdistribution:distribute"
            "$BINARY_PATH"
            "--app" "$APP_ID"
            "--release-notes" "$NOTES"
          )

          TARGET_GROUPS="${INPUT_GROUPS:-testers}"
          if [ -n "$TARGET_GROUPS" ]; then
            DIST_ARGS+=("--groups" "$TARGET_GROUPS")
          fi

          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            DIST_ARGS+=("--token" "$FIREBASE_TOKEN")
          fi

          firebase "${DIST_ARGS[@]}"

          # GitHub Actions Step Summary に記録
          FILE_SIZE=$(ls -lh "$BINARY_PATH" | awk '{print $5}')
          {
            echo "### 🚀 Firebase App Distribution 配布完了 (Android)"
            echo ""
            echo "| 項目 | 値 |"
            echo "| :--- | :--- |"
            echo "| **プラットフォーム** | Android ($TARGET_TYPE) |"
            echo "| **App ID** | \`$APP_ID\` |"
            echo "| **バイナリ** | \`$(basename "$BINARY_PATH")\` ($FILE_SIZE) |"
            echo "| **ビルド番号** | \`$GITHUB_RUN_NUMBER\` |"
            echo "| **テスターグループ** | \`$TARGET_GROUPS\` |"
            echo ""
            echo "🔗 [Firebase App Distribution コンソールで確認](https://console.firebase.google.com/project/scuba-life-a29fb/appdistribution)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Build Artifact
        if: always()
        env:
          INPUT_BINARY_TYPE: ${{ inputs.binary_type }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.binary_type || 'apk' }}-run-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

  distribute-ios:
    name: Distribute iOS
    if: inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🟢 Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Configure Firebase Credentials & Configs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_service_account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_service_account.json" >> $GITHUB_ENV
            echo "Service account credentials configured."
          fi

          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            mkdir -p ios/Runner
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Restored ios/Runner/GoogleService-Info.plist from secret."
          fi

          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            mkdir -p lib
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
            echo "Restored lib/firebase_options.dart from secret."
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build iOS IPA
        run: |
          flutter build ipa --release --build-number="${{ github.run_number }}"

      - name: 🚀 Distribute iOS to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          INPUT_GROUPS: ${{ inputs.groups }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          BINARY_PATH=$(find build/ios/ipa -name "*.ipa" | sort -r | head -n 1)
          if [ -z "$BINARY_PATH" ] || [ ! -f "$BINARY_PATH" ]; then
            echo "[ERROR] IPA file not found."
            exit 1
          fi

          APP_ID="1:37794312799:ios:b2ee25516922467f3c61ea"
          if [ -f "firebase.json" ]; then
            PARSED_ID=$(node -e "
              try {
                const j = JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));
                console.log(j.flutter?.platforms?.dart?.['lib/firebase_options.dart']?.configurations?.ios || '');
              } catch(e){}
            " 2>/dev/null || true)
            if [ -n "$PARSED_ID" ]; then
              APP_ID="$PARSED_ID"
            fi
          fi

          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            NOTES="$INPUT_RELEASE_NOTES"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || true)
            HASH=$(git rev-parse --short HEAD 2>/dev/null || true)
            TIMESTAMP=$(date "+%Y-%m-%d %H:%M:%S")
            ACTOR_NAME="${GITHUB_ACTOR:-ci}"
            NOTES="Scuba Life (iOS #$GITHUB_RUN_NUMBER)"$'\n'
            NOTES="${NOTES}Date: $TIMESTAMP"$'\n'
            NOTES="${NOTES}Branch: $GITHUB_REF_NAME ($HASH)"$'\n'
            NOTES="${NOTES}Triggered by: @$ACTOR_NAME"$'\n\n'
            NOTES="${NOTES}Commit:"$'\n'
            NOTES="${NOTES}$COMMIT_MSG"
          fi

          echo "Distributing $BINARY_PATH to App ID: $APP_ID..."

          DIST_ARGS=(
            "appdistribution:distribute"
            "$BINARY_PATH"
            "--app" "$APP_ID"
            "--release-notes" "$NOTES"
          )

          TARGET_GROUPS="${INPUT_GROUPS:-testers}"
          if [ -n "$TARGET_GROUPS" ]; then
            DIST_ARGS+=("--groups" "$TARGET_GROUPS")
          fi

          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            DIST_ARGS+=("--token" "$FIREBASE_TOKEN")
          fi

          firebase "${DIST_ARGS[@]}"

          FILE_SIZE=$(ls -lh "$BINARY_PATH" | awk '{print $5}')
          {
            echo "### 🚀 Firebase App Distribution 配布完了 (iOS)"
            echo ""
            echo "| 項目 | 値 |"
            echo "| :--- | :--- |"
            echo "| **プラットフォーム** | iOS (IPA) |"
            echo "| **App ID** | \`$APP_ID\` |"
            echo "| **バイナリ** | \`$(basename "$BINARY_PATH")\` ($FILE_SIZE) |"
            echo "| **ビルド番号** | \`$GITHUB_RUN_NUMBER\` |"
            echo "| **テスターグループ** | \`$TARGET_GROUPS\` |"
            echo ""
            echo "🔗 [Firebase App Distribution コンソールで確認](https://console.firebase.google.com/project/scuba-life-a29fb/appdistribution)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-run-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
